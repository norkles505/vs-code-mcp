[project]
name = "vscode-mcp"
version = "0.1.0"
description = "VS Code integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
vscode-mcp = "vscode_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
